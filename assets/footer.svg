<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#11111b"/><stop offset=".55" stop-color="#2a1f4a"/><stop offset="1" stop-color="#5e3a6e"/></linearGradient><clipPath id="frame"><rect width="1200" height="120" rx="18"/></clipPath></defs>
<style>
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; } }
.star { animation: tw ease-in-out infinite; }
@keyframes tw { 0%,100% { opacity: .2; } 50% { opacity: 1; } }
.petal { animation: fall linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes fall { from { transform: translate(-70px,-170px) rotate(0deg); } to { transform: translate(70px,170px) rotate(640deg); } }
.droid-run { animation: run 24s cubic-bezier(.45,0,.3,1) infinite; }
@keyframes run { 0% { transform: translateX(-840px); } 20% { transform: translateX(-476px); } 28% { transform: translateX(-476px); } 48% { transform: translateX(-112px); } 55% { transform: translateX(-112px); } 84% { transform: translateX(460px); } 100% { transform: translateX(460px); } }
.droid-bob { animation: bob .32s ease-in-out infinite alternate; }
@keyframes bob { to { transform: translateY(-.8px); } }
.droid-wheel { transform-box: fill-box; transform-origin: center; animation: spin .5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.droid-eye { animation: eye 2.6s ease-in-out infinite; }
@keyframes eye { 0%,60%,100% { opacity: 1; } 75% { opacity: .25; } }
</style>
